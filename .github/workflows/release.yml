name: Release Android

# Uploads the app to Google Play. Either:
#   - submit an existing EAS build (fill in build_id; no new build is used), or
#   - build a new AAB on EAS and submit it (leave build_id empty, or push a tag
#     like v1.0.6, which goes to internal testing).
#
# Requires:
#   - GitHub secret EXPO_TOKEN (expo.dev > Account settings > Access tokens)
#   - Google Play service account key uploaded to EAS:
#       eas credentials -p android  >  Google Service Account  >  Play Store submissions
#
# Tracks (submit profiles in eas.json): internal goes straight to testers;
# production arrives as a draft to review and send in Play Console.

on:
  workflow_dispatch:
    inputs:
      track:
        description: Google Play track
        type: choice
        options: [internal, production]
        default: internal
      build_id:
        description: Existing EAS build ID to submit (leave empty to build a new one)
        type: string
        required: false
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TRACK: ${{ inputs.track || 'internal' }}
      BUILD_ID: ${{ inputs.build_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Submit existing build
        if: env.BUILD_ID != ''
        run: eas submit --platform android --profile "$TRACK" --id "$BUILD_ID" --non-interactive

      - name: Type-check
        if: env.BUILD_ID == ''
        run: npx tsc --noEmit

      - name: Build AAB and submit
        if: env.BUILD_ID == ''
        run: eas build --platform android --profile production --non-interactive --no-wait --auto-submit-with-profile "$TRACK"
